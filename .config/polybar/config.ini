[global/wm]
margin-top = 0
margin-bottom = 0

;; Verify this path is correct for your theme.ini location
include-file = ./theme.ini

[bar/main]
monitor = 
bottom = false
width = 100%
height = 24
offset-x = 0
offset-y = 0
background = ${colors.base}
foreground = ${colors.text}
radius = 0.0
fixed-center = true
overline-size = 0
underline-size = 0
override-redirect = true

enable-ipc = true
click-left = 
click-middle = 
click-right = 
scroll-up = 
scroll-down = 

; Fonts
font-0 = "JetBrainsMono Nerd Font Mono:style=Medium:size=11;0"
font-1 = "unifont:fontformat=truetype:size=8:antialias=false;0"

; Modules - Added i3 for compatibility
modules-left = xworkspaces i3 music
modules-center = date
modules-right = dolar cpu memory battery volume brightness

module-margin-left = 1
module-margin-right = 1
padding-left = 0
padding-right = 0

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = true

label-mode-padding = 1
label-mode-background = ${colors.base}
label-mode-foreground = ${colors.mauve}

label-focused = "[%name%]"
label-focused-background = ${colors.surface1}
label-focused-foreground = ${colors.mauve}
label-focused-padding = 0

label-unfocused = " %name% "
label-unfocused-background = ${colors.base}
label-unfocused-foreground = ${colors.text}
label-unfocused-padding = 0

label-visible = " %name% "
label-visible-background = ${colors.base}
label-visible-foreground = ${colors.text}
label-visible-padding = 0

label-urgent = "!%name%!"
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 0

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <animation-charging><label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

; Restored your original indicators with Catppuccin colors
ramp-capacity-0 = "[  !  ]"
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1 = "[##   ]"
ramp-capacity-2 = "[###  ]"
ramp-capacity-3 = "[#### ]"
ramp-capacity-4 = "[#####]"
ramp-capacity-foreground = ${colors.green}

animation-charging-0 = "[-    ]"
animation-charging-1 = "[--   ]"
animation-charging-2 = "[---  ]"
animation-charging-3 = "[---- ]"
animation-charging-4 = "[-----]"
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 750

label-charging = "+%percentage%%"
label-charging-foreground = ${colors.text}
label-discharging = "%percentage%%"
label-discharging-foreground = ${colors.text}
label-full = "%percentage%%"
label-full-foreground = ${colors.green}

[module/xworkspaces]
type = internal/xworkspaces
enable-click = true
enable-scroll = true
pin-workspaces = false
label-active = "[%name%]"
label-active-foreground = ${colors.mauve}
label-active-background = ${colors.surface1}
label-occupied = " %name% "
label-occupied-foreground = ${colors.blue}
label-empty = " %name% "
label-empty-foreground = ${colors.overlay0}

[module/date]
type = internal/date
interval = 1.0
date = %Y-%m-%d
time = %H:%M:%S
format = <label>
label = %date% %time%
label-foreground = ${colors.lavender}

[module/cpu]
type = internal/cpu
interval = 2
label = "CPU %percentage:2%%"
label-foreground = ${colors.sapphire}

[module/memory]
type = internal/memory
interval = 2
label = "RAM %percentage_used%%"
label-foreground = ${colors.sky}

[module/volume]
type = internal/pulseaudio
label-volume = "VOL %percentage%%"
label-volume-foreground = ${colors.teal}
label-muted = "VOL MUT"
label-muted-foreground = ${colors.overlay0}

[module/brightness]
type = internal/backlight
card = intel_backlight
label = "BRT %percentage%%"
label-foreground = ${colors.yellow}
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/music]
type = custom/script
exec = /home/jotalea/.jotalea/scripts/music.sh status
interval = 0.1
label = "%output%"
label-foreground = ${colors.pink}

[module/dolar]
type = custom/script
exec = echo "\\$$(~/.jotalea/scripts/dolar.sh)"
interval = 1800
label-foreground = ${colors.green}

[settings]
screenchange-reload = true
