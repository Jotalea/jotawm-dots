########################################
# picom - HyDE-like effects for i3
# requires: picom-jonaburg-git
########################################

backend = "glx";
vsync = true;
experimental-backends = true;

########################################
# Fading
########################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 10;
fade-exclude = [
  "class_g = 'slop'",
  "name = 'slop'"
];

########################################
# Animations
########################################
animations = true;
animation-stiffness = 350.0;
animation-dampening = 18.0;
animation-clamping = false;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "zoom";
animation-window-mass = 1.0;
animation-delta = 10;
animation-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'slop'"
];

########################################
# Opacity / Transparency
########################################
inactive-opacity = 0.9;
active-opacity = 0.99;
inactive-opacity-override = false;

opacity-rule = [
  "90:class_g = 'code' && focused",
  "80:class_g = 'code' && !focused",
# "90:class_g = 'kitty' && focused",
# "75:class_g = 'kitty' && !focused",
];

focus-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "name = 'slop'"
];

########################################
# Shadows
########################################
shadow = false;
shadow-radius = 0;
shadow-opacity = 0.35;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = [
  "class_g = 'Polybar'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "class_g = 'slop'",
  "name = 'slop'",
];

########################################
# Corners / rounding
########################################
corner-radius = 16;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

########################################
# Blur
########################################
blur: {
  method = "dual_kawase";
  strength = 16;
  background = false;
  background-frame = false;
  background-fixed = false;
};

blur-background-exclude = [
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

########################################
# General
########################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = true;
unredir-if-possible-exclude = [
  "class_g = 'slop'",
  "name = 'slop'"
];
